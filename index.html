<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kogumo｜ギャラリー</title>
<meta name="description" content="旅した世界の景色">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Zen+Kaku+Gothic+New:wght@400;500&family=Zen+Maru+Gothic:wght@400;500&display=swap" rel="stylesheet">

<style>
/* =========================================================
   1. カラー・サイズなどの設定（ここを変えると全体の色が変わります）
   ========================================================= */
:root{
  --white:        #ffffff;
  --sky-pale:     #eaf4fd;   /* 背景の淡い水色 */
  --sky-light:    #d6ebfa;
  --blue-pastel:  #a9d4f2;   /* パステルブルー */
  --blue-main:    #6fabdc;   /* メインのスカイブルー（リンク・枠） */
  --blue-deep:    #4d84b4;   /* 見出し文字 */
  --gray-light:   #dfe8ef;   /* 罫線 */
  --text:         #5d7d95;   /* 本文 */
  --text-soft:    #8aa6b9;   /* 補助テキスト */

  --glass-bg:     rgba(255,255,255,.42);
  --glass-line:   rgba(255,255,255,.85);
  --glass-glow:   rgba(150,205,245,.35);

  --radius-lg: 46px;
  --radius-md: 26px;
  --radius-sm: 14px;

  --ease: cubic-bezier(.22,.68,.31,1);
}

/* =========================================================
   2. ベース
   ========================================================= */
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
html{ scroll-behavior:smooth; }

body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",sans-serif;
  color:var(--text);
  background:
    radial-gradient(1200px 700px at 78% 18%, rgba(255,255,255,.95), rgba(255,255,255,0) 60%),
    radial-gradient(900px 600px at 8% 82%, rgba(214,235,250,.9), rgba(255,255,255,0) 65%),
    linear-gradient(170deg,#f4fbff 0%,#e8f4fd 42%,#f7fcff 100%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

/* 背景に浮かぶ、ぼんやりした光の玉 */
.aura{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
.aura span{
  position:absolute; border-radius:50%; filter:blur(60px); opacity:.55;
  background:radial-gradient(circle at 35% 35%, #ffffff, rgba(169,212,242,.5) 55%, rgba(169,212,242,0) 72%);
  animation:drift 26s var(--ease) infinite alternate;
}
.aura span:nth-child(1){ width:520px; height:520px; top:-160px; left:-120px; }
.aura span:nth-child(2){ width:420px; height:420px; bottom:-140px; left:34%; animation-duration:34s; }
.aura span:nth-child(3){ width:600px; height:600px; top:6%; right:-200px; animation-duration:30s; }
@keyframes drift{ from{ transform:translate3d(0,0,0);} to{ transform:translate3d(0,-38px,0);} }

a{ color:inherit; text-decoration:none; }
img{ display:block; max-width:100%; }
button{ font:inherit; color:inherit; border:0; background:none; cursor:pointer; }
:focus-visible{ outline:2px solid var(--blue-main); outline-offset:3px; border-radius:6px; }

/* =========================================================
   3. ヘッダー
   ========================================================= */
.header{
  position:relative; z-index:5;
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:32px;
  padding:14px clamp(20px,4vw,56px);
}
.brand{ display:flex; align-items:center; gap:10px; justify-self:start; }
.brand svg{ width:30px; height:30px; }
.brand span{
  font-family:"Cormorant Garamond",serif;
  font-size:30px; letter-spacing:.04em; color:var(--blue-deep);
}
.nav{ display:flex; gap:clamp(16px,3vw,44px); }
.nav a{
  position:relative; font-size:13px; letter-spacing:.14em;
  color:var(--text); padding:6px 2px; transition:color .3s var(--ease);
}
.nav a::after{
  content:""; position:absolute; left:0; right:0; bottom:0; height:1.5px;
  background:var(--blue-main); transform:scaleX(0); transform-origin:center;
  transition:transform .35s var(--ease);
}
.nav a:hover{ color:var(--blue-main); }
.nav a:hover::after,
.nav a[aria-current="page"]::after{ transform:scaleX(1); }
.nav a[aria-current="page"]{ color:var(--blue-deep); }

/* =========================================================
   4. 全体レイアウト（左：ギャラリー ／ 右：説明）
   ========================================================= */
.stage{
  position:relative; z-index:2; flex:1;
  width:100%; max-width:1500px; margin:0 auto;
  padding:0 clamp(20px,4vw,56px) 24px;
  display:grid; grid-template-columns:minmax(0,1fr) clamp(320px,28vw,440px);
  gap:clamp(24px,3vw,56px); align-items:center;
}

/* ---------- ガラスのフレーム ---------- */
.viewer{
  position:relative;
  padding:clamp(14px,2vw,28px);
  border-radius:var(--radius-lg);
  background:linear-gradient(150deg, rgba(255,255,255,.72), rgba(255,255,255,.34) 46%, rgba(214,238,252,.5));
  border:1px solid var(--glass-line);
  backdrop-filter:blur(18px) saturate(150%);
  -webkit-backdrop-filter:blur(18px) saturate(150%);
  box-shadow:
    0 30px 70px -30px rgba(88,150,200,.45),
    0 0 0 10px rgba(255,255,255,.35),
    inset 0 1px 0 rgba(255,255,255,.95),
    inset 0 -30px 60px -30px var(--glass-glow);
  overflow:hidden;
  animation:rise .9s var(--ease) both;
}
/* ガラス表面の反射（ゆっくり流れる光） */
.viewer::before{
  content:""; position:absolute; top:-60%; left:-30%;
  width:60%; height:220%;
  background:linear-gradient(100deg, rgba(255,255,255,0), rgba(255,255,255,.55), rgba(255,255,255,0));
  transform:rotate(14deg);
  pointer-events:none;
  animation:sheen 11s var(--ease) infinite;
}
@keyframes sheen{
  0%,68%{ left:-40%; opacity:0; }
  74%{ opacity:.9; }
  100%{ left:120%; opacity:0; }
}
/* 内側のふちの発光 */
.viewer::after{
  content:""; position:absolute; inset:10px; border-radius:calc(var(--radius-lg) - 12px);
  border:1px solid rgba(255,255,255,.6); pointer-events:none;
}

/* ---------- メインの写真 ---------- */
.photo{
  position:relative;
  height:clamp(220px, 46vh, 460px);   /* ビューポートの高さに応じて写真エリアを調整 */
  width:100%;
  border-radius:var(--radius-md); overflow:hidden;
  background:linear-gradient(160deg,#dcefff,#b9dcf6);
  box-shadow:0 18px 40px -22px rgba(70,130,180,.55), 0 0 0 1px rgba(255,255,255,.8);
}
.photo img{
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:contain;   /* 写真の縦横比を保ったまま全景が見えるように */
  opacity:0;
  transition:opacity .7s var(--ease), transform 8s linear;
}
.photo img.is-active{ opacity:1; }

.counter{
  position:absolute; right:16px; bottom:14px; z-index:3;
  padding:5px 14px; border-radius:999px;
  background:rgba(255,255,255,.62); backdrop-filter:blur(8px);
  font-family:"Cormorant Garamond",serif; font-size:15px;
  letter-spacing:.12em; color:var(--blue-deep);
}

/* ---------- 前へ／次へ ---------- */
.arrow{
  position:absolute; top:50%; z-index:4;
  width:44px; height:44px; margin-top:-22px;
  display:grid; place-items:center; border-radius:50%;
  background:rgba(255,255,255,.55); border:1px solid rgba(255,255,255,.9);
  backdrop-filter:blur(10px);
  box-shadow:0 8px 20px -8px rgba(80,140,190,.5);
  color:var(--blue-main);
  transition:transform .3s var(--ease), background .3s var(--ease), box-shadow .3s var(--ease);
}
.arrow:hover{ background:#fff; transform:translateY(-3px) scale(1.06); box-shadow:0 12px 26px -10px rgba(80,140,190,.6); }
.arrow.prev{ left:clamp(6px,1vw,16px); }
.arrow.next{ right:clamp(6px,1vw,16px); }
.arrow svg{ width:16px; height:16px; }

/* ---------- 写真タイトル ---------- */
.caption{
  margin:12px 4px 0; min-height:20px;
  font-size:13px; letter-spacing:.1em; color:var(--text-soft);
  transition:opacity .4s var(--ease);
}

/* ---------- サムネイル ---------- */
.thumbs{
  margin-top:10px; display:flex; gap:clamp(8px,1vw,14px);
  overflow-x:auto; padding-bottom:4px; scrollbar-width:none;
}
.thumbs::-webkit-scrollbar{ display:none; }
.thumb{
  flex:0 0 clamp(58px, 8vw, 84px); position:relative;
  aspect-ratio:1/1; border-radius:calc(var(--radius-sm) - 4px); overflow:hidden;
  background:linear-gradient(160deg,#e6f4ff,#c6e2f7);
  box-shadow:0 6px 16px -10px rgba(70,130,180,.6);
  transition:transform .35s var(--ease), box-shadow .35s var(--ease);
}
.thumb img{ width:100%; height:100%; object-fit:cover; }
.thumb::after{
  content:""; position:absolute; inset:0; border-radius:inherit;
  border:2px solid transparent; transition:border-color .3s var(--ease);
}
.thumb:hover{ transform:translateY(-4px) scale(1.04); box-shadow:0 14px 26px -12px rgba(70,130,180,.65); }
.thumb.is-current::after{ border-color:var(--blue-main); }
.thumb.is-current{ box-shadow:0 10px 24px -12px rgba(90,160,215,.8); }

/* =========================================================
   5. 右側エリア
   ========================================================= */
.side{
  align-self:start;
  display:flex; flex-direction:column;
  text-align:center; padding:0 clamp(0px,1vw,16px);
  animation:rise 1s .12s var(--ease) both;
  min-height:100%;
}
.side-top{ flex-shrink:0; }
.side h1{
  margin:0; font-family:"Cormorant Garamond",serif; font-weight:400;
  font-size:clamp(52px,5.4vw,84px); line-height:1; letter-spacing:.02em;
  color:var(--blue-deep);
  text-shadow:0 6px 24px rgba(255,255,255,.9);
}
.side .jp{
  margin:14px 0 0; font-family:"Zen Maru Gothic",sans-serif;
  font-size:14px; letter-spacing:.42em; text-indent:.42em; color:var(--text-soft);
}
.ornament{ margin:26px auto 24px; width:min(240px,80%); display:block; color:var(--blue-pastel); }
.side p{
  margin:0 auto; max-width:34ch;
  font-family:"Zen Maru Gothic",sans-serif;
  font-size:14px; line-height:2.3; letter-spacing:.06em; color:var(--text);
}

/* マスコット（右下の雲の妖精・画像は images/fairies.png に置いてください） */
.fairies{
  margin-top:auto; margin-left:auto; margin-right:auto; margin-bottom:0;
  width:min(100%,360px); height:auto;
  filter:drop-shadow(0 26px 30px rgba(120,170,210,.3));
  animation:float 6s ease-in-out infinite;
  flex-shrink:0;
}
@keyframes float{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-9px);} }

/* =========================================================
   6. フッター
   ========================================================= */
.footer{
  position:relative; z-index:2;
  display:flex; flex-wrap:wrap; gap:10px 28px;
  align-items:center; justify-content:center;
  padding:22px clamp(20px,4vw,56px) 28px;
  border-top:1px solid var(--gray-light);
  font-size:12px; letter-spacing:.08em; color:var(--text-soft);
}
.footer nav{ display:flex; gap:22px; }
.footer a{ transition:color .3s var(--ease); }
.footer a:hover{ color:var(--blue-main); }
.sns{ display:flex; gap:14px; }
.sns a{
  width:32px; height:32px; display:grid; place-items:center; border-radius:50%;
  background:rgba(255,255,255,.7); border:1px solid var(--gray-light);
  color:var(--blue-main);
  transition:transform .3s var(--ease), box-shadow .3s var(--ease);
}
.sns a:hover{ transform:translateY(-3px); box-shadow:0 8px 18px -8px rgba(90,160,215,.7); }
.sns svg{ width:15px; height:15px; }

@keyframes rise{ from{ opacity:0; transform:translateY(22px);} to{ opacity:1; transform:none;} }

/* =========================================================
   7. 管理パネル（写真のアップロード）
   ========================================================= */
.admin-toggle{
  position:fixed; left:18px; bottom:18px; z-index:40;
  width:40px; height:40px; border-radius:50%;
  display:grid; place-items:center;
  background:rgba(255,255,255,.55); border:1px solid rgba(255,255,255,.9);
  backdrop-filter:blur(10px); color:var(--blue-main);
  box-shadow:0 8px 20px -8px rgba(80,140,190,.5);
  opacity:.55; transition:opacity .3s var(--ease), transform .3s var(--ease);
}
.admin-toggle:hover{ opacity:1; transform:translateY(-2px); }
.admin-toggle svg{ width:18px; height:18px; }

.admin-panel{
  position:fixed; left:18px; bottom:66px; z-index:40;
  width:min(320px,calc(100vw - 36px));
  max-height:min(70vh,560px); overflow-y:auto;
  padding:20px 20px 18px;
  border-radius:24px;
  background:linear-gradient(160deg, rgba(255,255,255,.88), rgba(232,246,255,.86));
  border:1px solid var(--glass-line);
  backdrop-filter:blur(20px) saturate(150%);
  box-shadow:0 24px 50px -22px rgba(70,130,180,.5), inset 0 1px 0 rgba(255,255,255,.9);
  transform:translateY(12px) scale(.98); opacity:0; pointer-events:none;
  transition:opacity .3s var(--ease), transform .3s var(--ease);
}
.admin-panel.is-open{ opacity:1; transform:none; pointer-events:auto; }

.admin-panel h2{
  margin:0; font-family:"Cormorant Garamond",serif; font-weight:500;
  font-size:22px; color:var(--blue-deep);
}
.admin-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
.admin-close{
  flex:none; width:26px; height:26px; display:grid; place-items:center;
  border-radius:50%; color:var(--text-soft);
  transition:background .3s var(--ease), color .3s var(--ease);
}
.admin-close:hover{ background:rgba(0,0,0,.06); color:var(--blue-deep); }
.admin-close svg{ width:14px; height:14px; }
.admin-panel .admin-sub{ margin:0 0 14px; font-size:11px; letter-spacing:.06em; color:var(--text-soft); }

.admin-field{ margin-bottom:12px; }
.admin-field label{
  display:block; margin-bottom:5px; font-size:11px; letter-spacing:.08em; color:var(--text-soft);
}
.admin-field input[type="password"],
.admin-field input[type="text"],
.admin-field input[type="file"]{
  width:100%; padding:9px 12px; font-size:13px; color:var(--text);
  background:rgba(255,255,255,.8); border:1px solid var(--gray-light); border-radius:12px;
  font-family:inherit;
}
.admin-field input:focus{ outline:2px solid var(--blue-main); outline-offset:1px; }

.admin-submit{
  width:100%; padding:10px; margin-top:2px; border-radius:999px;
  background:var(--blue-main); color:#fff; font-size:12px; letter-spacing:.14em;
  transition:background .3s var(--ease), transform .3s var(--ease);
}
.admin-submit:hover{ background:var(--blue-deep); transform:translateY(-1px); }
.admin-submit:disabled{ opacity:.55; pointer-events:none; }

.admin-msg{ margin:10px 0 0; font-size:12px; line-height:1.6; min-height:1em; }
.admin-msg.is-error{ color:#c65c5c; }
.admin-msg.is-ok{ color:var(--blue-deep); }

.admin-list{ margin:16px 0 0; padding-top:14px; border-top:1px solid var(--gray-light); }
.admin-list p{ margin:0 0 8px; font-size:11px; letter-spacing:.06em; color:var(--text-soft); }
.admin-row{
  display:flex; align-items:center; gap:10px; padding:6px 0;
  border-bottom:1px solid rgba(0,0,0,.04);
}
.admin-row img{ width:40px; height:40px; object-fit:cover; border-radius:8px; flex:none; }
.admin-row span{ flex:1; min-width:0; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.admin-row button{
  flex:none; font-size:11px; letter-spacing:.06em; color:#c65c5c;
  padding:4px 10px; border-radius:999px; border:1px solid rgba(198,92,92,.35);
  transition:background .3s var(--ease);
}
.admin-row button:hover{ background:rgba(198,92,92,.08); }

/* =========================================================
   8. レスポンシブ
   ========================================================= */
@media (max-width:1080px){
  .stage{ grid-template-columns:1fr; padding-top:24px; }
  .side{ order:-1; align-self:auto; }
  .side .jp{ margin-top:10px; }
  .ornament{ margin:18px auto; }
  .fairies{ width:min(70%,300px); }
}
@media (max-width:820px){
  .header{ flex-wrap:wrap; justify-content:space-between; gap:14px; }
  .nav{ order:3; width:100%; margin:0; justify-content:space-between; overflow-x:auto; padding-bottom:4px; }
  .nav a{ white-space:nowrap; font-size:12px; letter-spacing:.1em; }
  :root{ --radius-lg:30px; --radius-md:20px; }
  .thumb{ flex-basis:64px; }
  .arrow{ width:38px; height:38px; margin-top:-19px; }
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{ animation:none !important; transition-duration:.01ms !important; }
}
</style>
</head>

<body>

<div class="aura" aria-hidden="true"><span></span><span></span><span></span></div>

<!-- ============ ヘッダー ============ -->
<header class="header">
  <a class="brand" href="#">
    <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <path d="M9 22h13a5 5 0 0 0 .6-9.96A7 7 0 0 0 9.2 12.1 5 5 0 0 0 9 22Z" fill="#a9d4f2"/>

    <a href="#">ABOUT</a>

  </nav>

  <span aria-hidden="true"></span>
</header>

<!-- ============ メイン ============ -->
<main class="stage">

  <!-- 左：ギャラリー -->
  <section class="viewer" aria-label="写真ギャラリー">
    <div class="photo" id="photo">
      <button class="arrow prev" type="button" id="prev" aria-label="前の写真">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg>
      </button>
      <button class="arrow next" type="button" id="next" aria-label="次の写真">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>
      </button>
      <span class="counter" id="counter">01 / 01</span>

    </div>

  </aside>

</main>

<!-- ============ フッター ============ -->
<footer class="footer">

    </a>
  </div>
  <nav>
    <a href="#">利用規約</a>

</footer>

<!-- ============ 管理パネル（写真の追加・削除） ============ -->
<button class="admin-toggle" type="button" id="adminToggle" aria-label="写真を管理" aria-expanded="false">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3v3M12 18v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M3 12h3M18 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>
    <circle cx="12" cy="12" r="4"/>
  </svg>
</button>

<div class="admin-panel" id="adminPanel">
  <div class="admin-head">
    <h2>写真を追加</h2>
    <button type="button" class="admin-close" id="adminClose" aria-label="閉じる">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <p class="admin-sub">パスワードを入力して画像をアップロードします</p>

  <form id="uploadForm">
    <div class="admin-field">
      <label for="pw">パスワード</label>
      <input type="password" id="pw" name="password" autocomplete="current-password" required>
    </div>
    <div class="admin-field">
      <label for="file">画像ファイル</label>
      <input type="file" id="file" name="file" accept="image/*" required>
    </div>
    <div class="admin-field">
      <label for="title">タイトル（任意）</label>
      <input type="text" id="title" name="title" maxlength="60" placeholder="例：花咲く丘で">
    </div>
    <button class="admin-submit" type="submit" id="uploadBtn">ギャラリーに追加</button>
    <p class="admin-msg" id="uploadMsg"></p>
  </form>

  <div class="admin-list" id="adminList" hidden>
    <p>登録済みの写真（削除できます）</p>
    <div id="adminRows"></div>
  </div>
</div>

<script>
/* =========================================================
   写真データの取得元
   本番では /api/photos（Cloudflare Pages Functions + R2）から
   一覧を取得します。まだ functions/R2 を設定していない場合や
   file:// で直接開いた場合は、下のダミー写真で表示を確認できます。
   ========================================================= */
let PHOTOS = [
  { src: "images/01.jpg", title: "（プレビュー）花咲く丘で" },
  { src: "images/02.jpg", title: "（プレビュー）小さなお茶会" },
  { src: "images/03.jpg", title: "（プレビュー）夕暮れの雲海" }
];
let usingFallback = true;

/* 画像がまだ無いときに表示する、水色のプレースホルダー */
const PLACEHOLDER =
  "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 9">
       <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
         <stop offset="0" stop-color="#e8f5ff"/><stop offset="1" stop-color="#b9dcf6"/>
       </linearGradient></defs>
       <rect width="16" height="9" fill="url(#g)"/>
       <circle cx="8" cy="5" r="1.6" fill="#ffffff" opacity=".8"/>
     </svg>`);

const photoBox   = document.getElementById("photo");
const thumbsBox  = document.getElementById("thumbs");
const captionEl  = document.getElementById("caption");
const counterEl  = document.getElementById("counter");

let index = 0;
const layers = [];

/* 画像を2枚重ねて、切り替え時にクロスフェードさせます */
function buildLayers(){
  layers.length = 0;
  photoBox.querySelectorAll("img").forEach(el => el.remove());
  for (let i = 0; i < 2; i++){
    const img = new Image();
    img.alt = "";
    img.decoding = "async";
    img.onerror = () => { img.src = PLACEHOLDER; };
    photoBox.prepend(img);
    layers.push(img);
  }
  if (PHOTOS[0]){
    layers[0].src = PHOTOS[0].src;
    layers[0].alt = PHOTOS[0].title || "";
    layers[0].classList.add("is-active");
  }
}

function buildThumbs(){
  thumbsBox.innerHTML = "";
  PHOTOS.forEach((p, i) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "thumb" + (i === 0 ? " is-current" : "");
    btn.setAttribute("role", "tab");
    btn.setAttribute("aria-label", (i + 1) + "枚目" + (p.title ? "：" + p.title : ""));
    btn.setAttribute("aria-selected", i === 0 ? "true" : "false");

    const img = new Image();
    img.src = p.src;
    img.alt = "";
    img.loading = "lazy";
    img.onerror = () => { img.src = PLACEHOLDER; };

    btn.appendChild(img);
    btn.addEventListener("click", () => show(i));
    thumbsBox.appendChild(btn);
  });
}

function show(next){
  if (!PHOTOS[next]) return;
  index = next;

  const front = layers.find(l => l.classList.contains("is-active"));
  const back  = layers.find(l => l !== front);

  back.alt = PHOTOS[index].title || "";
  back.src = PHOTOS[index].src;
  back.classList.add("is-active");
  front.classList.remove("is-active");

  update();
}

function update(){
  captionEl.style.opacity = 0;
  setTimeout(() => {
    captionEl.textContent = PHOTOS[index] ? (PHOTOS[index].title || "") : "";
    captionEl.style.opacity = 1;
  }, 180);

  counterEl.textContent = PHOTOS.length
    ? String(index + 1).padStart(2, "0") + " / " + String(PHOTOS.length).padStart(2, "0")
    : "00 / 00";

  [...thumbsBox.children].forEach((el, i) => {
    el.classList.toggle("is-current", i === index);
    el.setAttribute("aria-selected", i === index ? "true" : "false");
  });
}

const step = d => { if (PHOTOS.length) show((index + d + PHOTOS.length) % PHOTOS.length); };

document.getElementById("prev").addEventListener("click", () => step(-1));
document.getElementById("next").addEventListener("click", () => step(1));
document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft")  step(-1);
  if (e.key === "ArrowRight") step(1);
});

/* スマホでのスワイプ操作 */
let touchX = null;
photoBox.addEventListener("touchstart", e => { touchX = e.changedTouches[0].clientX; }, {passive:true});
photoBox.addEventListener("touchend", e => {
  if (touchX === null) return;
  const diff = e.changedTouches[0].clientX - touchX;
  if (Math.abs(diff) > 50) step(diff < 0 ? 1 : -1);
  touchX = null;
}, {passive:true});

/* 右エリアの区切り線（ー☁ー）を、＜＞ボタンと同じ高さに合わせます
   （テキスト部分だけをずらし、妖精の位置には影響させません） */
const sideTopEl = document.querySelector(".side-top");
const ornamentEl = document.querySelector(".ornament");

function alignOrnament(){
  if (window.matchMedia("(max-width:1080px)").matches){
    sideTopEl.style.marginTop = "";
    return;
  }
  sideTopEl.style.marginTop = "0px";
  const p = photoBox.getBoundingClientRect();
  const o = ornamentEl.getBoundingClientRect();
  const gap = (p.top + p.height / 2) - (o.top + o.height / 2);
  /* 小さな微調整のみに留め、大きくずれても影響を最小限にします */
  sideTopEl.style.marginTop = Math.max(-12, Math.min(gap, 32)) + "px";
}

window.addEventListener("resize", alignOrnament);
window.addEventListener("load", alignOrnament);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(alignOrnament);
if (window.ResizeObserver) new ResizeObserver(alignOrnament).observe(photoBox);

function renderGallery(keepIndex){
  buildLayers();
  buildThumbs();
  index = 0;
  if (typeof keepIndex === "number" && PHOTOS[keepIndex]) index = keepIndex;
  if (layers[0] && PHOTOS[index]){
    layers.forEach(l => l.classList.remove("is-active"));
    layers[0].src = PHOTOS[index].src;
    layers[0].alt = PHOTOS[index].title || "";
    layers[0].classList.add("is-active");
  }
  update();
  alignOrnament();
}

/* サーバー（/api/photos）から写真一覧を取得します。
   まだ Functions / R2 が設定されていない場合はここで失敗し、
   上のダミー写真のまま表示されます。 */
async function loadPhotos(){
  try{
    const res = await fetch("/api/photos", { cache: "no-store" });
    if (!res.ok) throw new Error("failed");
    const list = await res.json();
    usingFallback = false;
    PHOTOS = list.map(p => ({
      src: "/api/image/" + encodeURIComponent(p.key),
      title: p.title || "",
      key: p.key
    }));
    if (!PHOTOS.length){
      PHOTOS = [{ src: PLACEHOLDER, title: "まだ写真がありません" }];
    }
    renderGallery();
  }catch(err){
    /* fetch に失敗した場合はダミー写真のまま。管理パネルにも案内を出します */
  }
  refreshAdminList();
}

/* ============ 管理パネル ============ */
const adminToggle = document.getElementById("adminToggle");
const adminPanel  = document.getElementById("adminPanel");
const adminClose  = document.getElementById("adminClose");
const uploadForm  = document.getElementById("uploadForm");
const uploadBtn   = document.getElementById("uploadBtn");
const uploadMsg   = document.getElementById("uploadMsg");
const pwField     = document.getElementById("pw");
const adminListEl = document.getElementById("adminList");
const adminRowsEl = document.getElementById("adminRows");

/* パスワードは「このタブを開いている間だけ」記憶します（sessionStorage） */
const savedPw = sessionStorage.getItem("kogumo-admin-pw");
if (savedPw) pwField.value = savedPw;

function openAdminPanel(){
  adminPanel.classList.add("is-open");
  adminToggle.setAttribute("aria-expanded", "true");
  refreshAdminList();
}
function closeAdminPanel(){
  adminPanel.classList.remove("is-open");
  adminToggle.setAttribute("aria-expanded", "false");
}

adminToggle.addEventListener("click", () => {
  if (adminPanel.classList.contains("is-open")) closeAdminPanel();
  else openAdminPanel();
});

adminClose.addEventListener("click", closeAdminPanel);

/* パネルの外側をクリックしたら閉じます */
document.addEventListener("click", (e) => {
  if (!adminPanel.classList.contains("is-open")) return;
  if (adminPanel.contains(e.target) || adminToggle.contains(e.target)) return;
  closeAdminPanel();
});

/* Escキーでも閉じられるようにします */
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && adminPanel.classList.contains("is-open")) closeAdminPanel();
});

function setMsg(text, type){
  uploadMsg.textContent = text;
  uploadMsg.className = "admin-msg" + (type ? " is-" + type : "");
}

uploadForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const fileInput = document.getElementById("file");
  const titleInput = document.getElementById("title");
  const password = pwField.value;

  if (!fileInput.files[0]){
    setMsg("画像ファイルを選んでください。", "error");
    return;
  }

  const fd = new FormData();
  fd.append("password", password);
  fd.append("file", fileInput.files[0]);
  fd.append("title", titleInput.value);

  uploadBtn.disabled = true;
  setMsg("アップロード中…");

  try{
    const res = await fetch("/api/photos", { method: "POST", body: fd });
    if (res.status === 401){
      setMsg("パスワードが違います。", "error");
      return;
    }
    if (!res.ok){
      const text = await res.text().catch(() => "");
      setMsg(text || "アップロードに失敗しました。", "error");
      return;
    }
    sessionStorage.setItem("kogumo-admin-pw", password);
    setMsg("追加しました。", "ok");
    fileInput.value = "";
    titleInput.value = "";
    await loadPhotosAndJumpToLatest();
    refreshAdminList();
  }catch(err){
    setMsg("通信エラーが発生しました。functions/R2 の設定をご確認ください。", "error");
  }finally{
    uploadBtn.disabled = false;
  }
});

async function loadPhotosAndJumpToLatest(){
  try{
    const res = await fetch("/api/photos", { cache: "no-store" });
    if (!res.ok) throw new Error("failed");
    const list = await res.json();
    usingFallback = false;
    PHOTOS = list.map(p => ({
      src: "/api/image/" + encodeURIComponent(p.key),
      title: p.title || "",
      key: p.key
    }));
    renderGallery(PHOTOS.length - 1);
  }catch(err){ /* ignore */ }
}

async function refreshAdminList(){
  if (usingFallback){
    adminListEl.hidden = false;
    adminRowsEl.innerHTML =
      '<p class="admin-msg is-error" style="margin:0;">/api/photos に接続できません。Cloudflare Pages の Functions と R2 バインディングを設定してください。</p>';
    return;
  }
  if (!PHOTOS.length){
    adminListEl.hidden = true;
    return;
  }
  adminListEl.hidden = false;
  adminRowsEl.innerHTML = "";
  PHOTOS.forEach(p => {
    if (!p.key) return;
    const row = document.createElement("div");
    row.className = "admin-row";

    const img = document.createElement("img");
    img.src = p.src;
    img.alt = "";
    img.onerror = () => { img.src = PLACEHOLDER; };

    const span = document.createElement("span");
    span.textContent = p.title || p.key;

    const del = document.createElement("button");
    del.type = "button";
    del.textContent = "削除";
    del.addEventListener("click", () => deletePhoto(p.key));

    row.append(img, span, del);
    adminRowsEl.appendChild(row);
  });
}

async function deletePhoto(key){
  const password = pwField.value;
  if (!password){
    setMsg("削除にはパスワードの入力が必要です。", "error");
    return;
  }
  if (!confirm("この写真を削除しますか？")) return;

  try{
    const res = await fetch("/api/photos?key=" + encodeURIComponent(key), {
      method: "DELETE",
      headers: { "x-upload-password": password }
    });
    if (res.status === 401){
      setMsg("パスワードが違います。", "error");
      return;
    }
    if (!res.ok){
      setMsg("削除に失敗しました。", "error");
      return;
    }
    setMsg("削除しました。", "ok");
    await loadPhotosAndJumpToLatest();
    refreshAdminList();
  }catch(err){
    setMsg("通信エラーが発生しました。", "error");
  }
}

renderGallery();
loadPhotos();
</script>
</body>
</html>
